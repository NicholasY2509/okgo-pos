version: '3.8'

services:
  app:
    image: ghcr.io/nicholasy2509/okgo-pos:latest
    container_name: okgo_app
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - CRON_SECRET=${CRON_SECRET:-okgo-secret-cron-key-123}
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mariadb:10.11
    container_name: okgo_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-okgo}
      - MYSQL_USER=${MYSQL_USER:-okgo_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-okgo_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: okgo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: okgo_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  cron:
    image: alpine:latest
    container_name: okgo_cron
    restart: always
    depends_on:
      - app
    networks:
      - app-network
    command: >
      /bin/sh -c "apk add --no-cache curl && echo '0 0 * * * curl -sS -X GET \"http://app:3000/api/cron/expire-vouchers?secret=$${CRON_SECRET}\" >> /var/log/cron.log 2>&1' > /etc/crontabs/root && crond -f -d 8"
    environment:
      - CRON_SECRET=${CRON_SECRET:-okgo-secret-cron-key-123}

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
